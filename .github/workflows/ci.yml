name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Set up formatting tool
        run: |
          python3 -m venv .build/venv
          .build/venv/bin/pip install -r requirements-dev.txt
      - name: Lint and format
        run: |
          .build/venv/bin/clang-format --dry-run --Werror tools/*.m tools/*.h tests/*.m Sources/Session/*.[hm] Sources/Statistics/*.[hm] Sources/Presentation/*.[hm] Sources/Diagnostics/*.[hm] Sources/Compatibility/*.[hm] Sources/Localization/*.[hm] rootreader/*.[hm] producerprobe/*.[hm]
          for script in tools/*.sh; do sh -n "$script"; done
      - name: Tests and coverage (minimum 50% for response evaluator)
        run: tools/test.sh
      - name: Build iOS diagnostic
        run: tools/build-probe.sh
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: theos/theos
          ref: 6e7b8c40e0f5f9f5b2377800dc1e42cd2560d24a
          path: .build/theos
          submodules: recursive
      - name: Install jailbreak signing tool
        run: brew install ldid
      - name: Build legacy tweak for compatibility only
        run: |
          export THEOS="$GITHUB_WORKSPACE/.build/theos"
          mkdir -p "$THEOS/sdks"
          sdk_version=$(xcrun --sdk iphoneos --show-sdk-version)
          ln -s "$(xcrun --sdk iphoneos --show-sdk-path)" "$THEOS/sdks/iPhoneOS${sdk_version}.sdk"
          make package FINALPACKAGE=1
      - name: Build opt-in producer diagnostic package
        run: THEOS="$GITHUB_WORKSPACE/.build/theos" make -C producerprobe package FINALPACKAGE=1

  localization-ui:
    runs-on: macos-15
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        language: [en, he]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify language, layout and both appearances
        env:
          IEB_PREVIEW_LANGUAGE: ${{ matrix.language }}
        run: |
          runtime=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; print(next(r["identifier"] for r in reversed(json.load(sys.stdin)["runtimes"]) if r["isAvailable"] and "iOS" in r["name"]))')
          qa_sim=$(xcrun simctl create "IEB-CI-$IEB_PREVIEW_LANGUAGE" com.apple.CoreSimulator.SimDeviceType.iPhone-15-Pro "$runtime")
          cleanup() {
            xcrun simctl shutdown "$qa_sim" >/dev/null 2>&1 || true
            xcrun simctl delete "$qa_sim"
          }
          trap cleanup EXIT
          for appearance in light dark; do
            IEB_PREVIEW_APPEARANCE="$appearance" sh tools/preview-ui.sh "$qa_sim"
          done

  localization-additional:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify additional languages in both appearances
        run: |
          languages=$(python3 -c 'from pathlib import Path; print(" ".join(sorted(p.stem for p in Path("Resources/Localizations").glob("*.lproj") if p.stem not in ("en", "he"))))')
          if [ -n "$languages" ]; then
            sh tools/preview-localizations.sh $languages
          fi
