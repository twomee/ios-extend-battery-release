default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: local
    hooks:
      - id: objc-format
        stages: [pre-commit]
        name: Format diagnostic Objective-C
        entry: clang-format -i
        language: python
        additional_dependencies: [clang-format==23.1.3]
        files: '^(tools|tests|Sources|rootreader|producerprobe)/.*\.[hm]$'
      - id: objc-tests
        stages: [pre-push]
        name: Test full diagnostic suite before push
        entry: tools/test.sh
        language: system
        pass_filenames: false
        files: '^(tools|tests|Sources|rootreader|producerprobe)/'
      - id: secrets
        stages: [pre-commit]
        name: Scan staged changes for secrets
        entry: gitleaks git --pre-commit --staged --redact
        language: system
        pass_filenames: false
